name: Add Brilliant Move via API

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Chess.com Analysis URL'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install all dependencies
        run: |
          # Install Python dependencies
          pip install Pillow cairosvg
          # Install system dependencies for C++ and fonts
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev fonts-dejavu-core

      - name: Build C++ executables
        run: make

      - name: Generate Post and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. 최신 변경사항을 먼저 가져옵니다.
          git pull --rebase
          
          # 2. C++ 프로그램을 실행하여 게시물 파일을 생성합니다.
          echo "${{ github.event.inputs.url }}" | ./bin/Record_My_Brilliancy
          
          # 3. 새 게시물 포함하여 스트릭 파일을 다시 생성합니다.
          ./bin/generate_streak
          
          # 4. 생성된 모든 파일들을 Add, Commit, Push 합니다.
          git add _posts/ images/ _includes/streak.html
          if ! git diff --staged --quiet; then
            git commit -m "feat: Add new brilliant move from API"
            git push
          else
            echo "No new post was created, nothing to commit."
          fi