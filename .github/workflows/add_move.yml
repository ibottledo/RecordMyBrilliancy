name: Add Brilliant Move via API

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Chess.com Analysis URL'
        required: true

jobs:
  process-move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install all dependencies
        run: |
          # Install Python dependencies
          pip install Pillow cairosvg
          # Install system dependencies for C++ and fonts
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev fonts-dejavu-core

      - name: Build C++ executables
        run: make

      - name: Run the brilliant move recorder
        run: echo "${{ github.event.inputs.url }}" | ./bin/Record_My_Brilliancy

      - name: Commit and push new post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          git add _posts/ images/
          if ! git diff --staged --quiet; then
            git commit -m "feat: Add new brilliant move from API"
            git push
          else
            echo "No new post was created, nothing to commit."
          fi